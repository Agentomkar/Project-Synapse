<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A0E17"/>
      <stop offset="1" stop-color="#141A28"/>
    </linearGradient>
    <linearGradient id="coreGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00F0FF"/>
      <stop offset="1" stop-color="#0891B2"/>
    </linearGradient>
    <linearGradient id="fwGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF3860"/>
      <stop offset="1" stop-color="#991B1B"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="url(#bgGrad)"/>
  
  <!-- Grid pattern -->
  <g opacity="0.08" stroke="#00F0FF" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
    <line x1="0" y1="700" x2="1200" y2="700"/>
    <line x1="0" y1="800" x2="1200" y2="800"/>
  </g>

  <!-- Title -->
  <text x="600" y="40" font-size="24" font-weight="bold" fill="#00F0FF" text-anchor="middle" filter="url(#glow)">PROJECT SYNAPSE</text>
  <text x="600" y="65" font-size="12" fill="#8B9BB4" text-anchor="middle" letter-spacing="2">CAMPUS NETWORK TOPOLOGY</text>

  <!-- Connection Lines (drawn first so they're behind nodes) -->
  <g stroke="#00F0FF" stroke-width="2" fill="none" opacity="0.5">
    <!-- ISPs to FW -->
    <line x1="300" y1="140" x2="580" y2="220"/>
    <line x1="900" y1="140" x2="620" y2="220"/>
    
    <!-- FW to Cores -->
    <line x1="580" y1="260" x2="420" y2="340"/>
    <line x1="620" y1="260" x2="780" y2="340"/>
    
    <!-- Core to Core (HSRP sync) -->
    <line x1="470" y1="360" x2="730" y2="360" stroke-dasharray="5,5" stroke="#00FF88"/>
    
    <!-- Cores to Dist -->
    <line x1="400" y1="400" x2="250" y2="500"/>
    <line x1="420" y1="400" x2="580" y2="500"/>
    <line x1="440" y1="400" x2="900" y2="500"/>
    <line x1="760" y1="400" x2="250" y2="500" stroke-dasharray="3,3"/>
    <line x1="780" y1="400" x2="580" y2="500" stroke-dasharray="3,3"/>
    <line x1="800" y1="400" x2="900" y2="500" stroke-dasharray="3,3"/>
    
    <!-- Dist to Access -->
    <line x1="220" y1="540" x2="120" y2="640"/>
    <line x1="280" y1="540" x2="320" y2="640"/>
    <line x1="540" y1="540" x2="480" y2="640"/>
    <line x1="620" y1="540" x2="700" y2="640"/>
    <line x1="860" y1="540" x2="860" y2="640"/>
    <line x1="940" y1="540" x2="1060" y2="640"/>
    
    <!-- Access to Endpoints -->
    <line x1="120" y1="680" x2="80" y2="780"/>
    <line x1="320" y1="680" x2="280" y2="780"/>
    <line x1="480" y1="680" x2="440" y2="780"/>
    <line x1="700" y1="680" x2="660" y2="780"/>
    <line x1="860" y1="680" x2="820" y2="780"/>
    <line x1="1060" y1="680" x2="1020" y2="780"/>
    
    <!-- AI Server to Dist-A -->
    <line x1="250" y1="520" x2="1130" y2="520" stroke="#00FF88" stroke-dasharray="2,4"/>
  </g>

  <!-- ISP-1 -->
  <g>
    <circle cx="250" cy="120" r="35" fill="#141A28" stroke="#8B9BB4" stroke-width="2"/>
    <text x="250" y="118" text-anchor="middle" fill="#8B9BB4" font-size="11" font-weight="bold">ISP-1</text>
    <text x="250" y="132" text-anchor="middle" fill="#8B9BB4" font-size="9">203.0.113.1</text>
    <text x="250" y="170" text-anchor="middle" fill="#8B9BB4" font-size="9">Primary ISP</text>
  </g>

  <!-- ISP-2 -->
  <g>
    <circle cx="950" cy="120" r="35" fill="#141A28" stroke="#8B9BB4" stroke-width="2"/>
    <text x="950" y="118" text-anchor="middle" fill="#8B9BB4" font-size="11" font-weight="bold">ISP-2</text>
    <text x="950" y="132" text-anchor="middle" fill="#8B9BB4" font-size="9">198.51.100.1</text>
    <text x="950" y="170" text-anchor="middle" fill="#8B9BB4" font-size="9">Backup ISP</text>
  </g>

  <!-- Firewall -->
  <g filter="url(#glow)">
    <rect x="540" y="220" width="120" height="50" rx="8" fill="url(#fwGrad)"/>
    <text x="600" y="245" text-anchor="middle" fill="white" font-size="13" font-weight="bold">FIREWALL</text>
    <text x="600" y="262" text-anchor="middle" fill="white" font-size="10">pfSense / ASA</text>
    <text x="600" y="295" text-anchor="middle" fill="#FF3860" font-size="10">10.0.0.1 · NAT · ACLs</text>
  </g>

  <!-- Core-SW-1 -->
  <g filter="url(#glow)">
    <rect x="320" y="340" width="120" height="55" rx="8" fill="url(#coreGrad)"/>
    <text x="380" y="365" text-anchor="middle" fill="#0A0E17" font-size="13" font-weight="bold">Core-SW-1</text>
    <text x="380" y="382" text-anchor="middle" fill="#0A0E17" font-size="10">L3 · HSRP Active</text>
    <text x="380" y="420" text-anchor="middle" fill="#00F0FF" font-size="10">3650-24PS</text>
  </g>

  <!-- Core-SW-2 -->
  <g filter="url(#glow)">
    <rect x="700" y="340" width="120" height="55" rx="8" fill="url(#coreGrad)" opacity="0.75"/>
    <text x="760" y="365" text-anchor="middle" fill="#0A0E17" font-size="13" font-weight="bold">Core-SW-2</text>
    <text x="760" y="382" text-anchor="middle" fill="#0A0E17" font-size="10">L3 · HSRP Standby</text>
    <text x="760" y="420" text-anchor="middle" fill="#00F0FF" font-size="10">3650-24PS</text>
  </g>

  <!-- HSRP label on sync line -->
  <text x="600" y="355" text-anchor="middle" fill="#00FF88" font-size="10" font-style="italic">HSRP sync</text>

  <!-- Dist Switches -->
  <g>
    <rect x="180" y="500" width="140" height="45" rx="6" fill="#141A28" stroke="#00F0FF" stroke-width="2"/>
    <text x="250" y="520" text-anchor="middle" fill="#00F0FF" font-size="12" font-weight="bold">Dist-SW-A</text>
    <text x="250" y="536" text-anchor="middle" fill="#8B9BB4" font-size="9">Admin Block · V10,20,99</text>
  </g>
  
  <g>
    <rect x="510" y="500" width="140" height="45" rx="6" fill="#141A28" stroke="#00F0FF" stroke-width="2"/>
    <text x="580" y="520" text-anchor="middle" fill="#00F0FF" font-size="12" font-weight="bold">Dist-SW-B</text>
    <text x="580" y="536" text-anchor="middle" fill="#8B9BB4" font-size="9">Academic · V30,40,70,99</text>
  </g>
  
  <g>
    <rect x="830" y="500" width="140" height="45" rx="6" fill="#141A28" stroke="#00F0FF" stroke-width="2"/>
    <text x="900" y="520" text-anchor="middle" fill="#00F0FF" font-size="12" font-weight="bold">Dist-SW-C</text>
    <text x="900" y="536" text-anchor="middle" fill="#8B9BB4" font-size="9">Lab/CCTV · V50,60,80,99</text>
  </g>

  <!-- Access Switches -->
  <g font-size="9" fill="#8B9BB4">
    <rect x="80" y="640" width="80" height="35" rx="4" fill="#141A28" stroke="#67E8F9"/>
    <text x="120" y="657" text-anchor="middle" fill="#67E8F9" font-size="10" font-weight="bold">Access-A1</text>
    <text x="120" y="670" text-anchor="middle">VLAN 10</text>
    
    <rect x="280" y="640" width="80" height="35" rx="4" fill="#141A28" stroke="#67E8F9"/>
    <text x="320" y="657" text-anchor="middle" fill="#67E8F9" font-size="10" font-weight="bold">Access-A2</text>
    <text x="320" y="670" text-anchor="middle">VLAN 20</text>
    
    <rect x="440" y="640" width="80" height="35" rx="4" fill="#141A28" stroke="#67E8F9"/>
    <text x="480" y="657" text-anchor="middle" fill="#67E8F9" font-size="10" font-weight="bold">Access-B1</text>
    <text x="480" y="670" text-anchor="middle">VLAN 30, 40</text>
    
    <rect x="660" y="640" width="80" height="35" rx="4" fill="#141A28" stroke="#FF3860"/>
    <text x="700" y="657" text-anchor="middle" fill="#FF3860" font-size="10" font-weight="bold">Access-B2</text>
    <text x="700" y="670" text-anchor="middle">VLAN 70</text>
    
    <rect x="820" y="640" width="80" height="35" rx="4" fill="#141A28" stroke="#67E8F9"/>
    <text x="860" y="657" text-anchor="middle" fill="#67E8F9" font-size="10" font-weight="bold">Access-C1</text>
    <text x="860" y="670" text-anchor="middle">VLAN 50, 60</text>
    
    <rect x="1020" y="640" width="80" height="35" rx="4" fill="#141A28" stroke="#67E8F9"/>
    <text x="1060" y="657" text-anchor="middle" fill="#67E8F9" font-size="10" font-weight="bold">Access-C2</text>
    <text x="1060" y="670" text-anchor="middle">VLAN 80</text>
  </g>

  <!-- Endpoints -->
  <g font-size="9">
    <!-- Admin PC -->
    <rect x="55" y="780" width="50" height="30" rx="3" fill="#141A28" stroke="#8B9BB4"/>
    <text x="80" y="798" text-anchor="middle" fill="#E4E7EB" font-size="9">PC-Admin</text>
    <text x="80" y="830" text-anchor="middle" fill="#00F0FF" font-size="8">10.10.0.50</text>
    
    <!-- Faculty -->
    <rect x="255" y="780" width="50" height="30" rx="3" fill="#141A28" stroke="#8B9BB4"/>
    <text x="280" y="798" text-anchor="middle" fill="#E4E7EB" font-size="9">Faculty</text>
    <text x="280" y="830" text-anchor="middle" fill="#67E8F9" font-size="8">10.20.0.50</text>
    
    <!-- Student -->
    <rect x="415" y="780" width="50" height="30" rx="3" fill="#141A28" stroke="#8B9BB4"/>
    <text x="440" y="798" text-anchor="middle" fill="#E4E7EB" font-size="9">Student</text>
    <text x="440" y="830" text-anchor="middle" fill="#00FF88" font-size="8">10.30.0.100</text>
    
    <!-- Exam -->
    <rect x="635" y="780" width="50" height="30" rx="3" fill="#141A28" stroke="#FF3860"/>
    <text x="660" y="798" text-anchor="middle" fill="#E4E7EB" font-size="9">PC-Exam</text>
    <text x="660" y="830" text-anchor="middle" fill="#FF3860" font-size="8">10.70.0.50</text>
    
    <!-- CCTV + IoT -->
    <rect x="795" y="780" width="50" height="30" rx="3" fill="#141A28" stroke="#A78BFA"/>
    <text x="820" y="798" text-anchor="middle" fill="#E4E7EB" font-size="9">CCTV/IoT</text>
    <text x="820" y="830" text-anchor="middle" fill="#A78BFA" font-size="8">10.50.0.50</text>
    
    <!-- Guest -->
    <rect x="995" y="780" width="50" height="30" rx="3" fill="#141A28" stroke="#8B9BB4"/>
    <text x="1020" y="798" text-anchor="middle" fill="#E4E7EB" font-size="9">Guest</text>
    <text x="1020" y="830" text-anchor="middle" fill="#8B9BB4" font-size="8">10.80.0.50</text>
  </g>

  <!-- AI Server (SYNAPSE Orchestrator) - highlighted -->
  <g filter="url(#glow)">
    <rect x="1050" y="490" width="130" height="60" rx="8" fill="#00FF88" opacity="0.9"/>
    <text x="1115" y="513" text-anchor="middle" fill="#0A0E17" font-size="12" font-weight="bold">AI-SERVER</text>
    <text x="1115" y="528" text-anchor="middle" fill="#0A0E17" font-size="10">SYNAPSE Core</text>
    <text x="1115" y="543" text-anchor="middle" fill="#0A0E17" font-size="9">10.99.0.100</text>
  </g>

  <!-- Legend -->
  <g font-size="10" fill="#8B9BB4">
    <rect x="20" y="860" width="1160" height="30" fill="#141A28" stroke="#1F2937"/>
    <text x="40" y="880" fill="#00F0FF" font-weight="bold">LEGEND:</text>
    <circle cx="110" cy="876" r="4" fill="#00F0FF"/>
    <text x="120" y="880">Core/Dist (L3)</text>
    <circle cx="220" cy="876" r="4" fill="#67E8F9"/>
    <text x="230" y="880">Access (L2)</text>
    <circle cx="320" cy="876" r="4" fill="#FF3860"/>
    <text x="330" y="880">Firewall / High-Sec VLAN</text>
    <circle cx="470" cy="876" r="4" fill="#00FF88"/>
    <text x="480" y="880">AI Orchestrator</text>
    <line x1="580" y1="876" x2="610" y2="876" stroke="#00F0FF" stroke-width="2"/>
    <text x="620" y="880">Primary link</text>
    <line x1="700" y1="876" x2="730" y2="876" stroke="#00F0FF" stroke-width="2" stroke-dasharray="3,3"/>
    <text x="740" y="880">Redundant / Backup</text>
    <line x1="860" y1="876" x2="890" y2="876" stroke="#00FF88" stroke-width="2" stroke-dasharray="5,5"/>
    <text x="900" y="880">HSRP sync</text>
    <text x="1050" y="880" fill="#8B9BB4" font-style="italic">Team 11 · Kalasalingam U</text>
  </g>
</svg>
